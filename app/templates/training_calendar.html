{% extends "inszn_base.html" %}
{% block styles %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tools-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/training_calendar.css') }}">
{% endblock %}
{% block content %}
<header>
    <h1><span>//</span> Training Calendar <span>//</span></h1>
</header>

<!-- Tab Nav -->
<div class="tab">
  <button class="tablinks active" onclick="openTab(event, 'calendar_tab')">Calendar</button>
  <button class="tablinks tab-link" onclick="window.location.href='{{ url_for('lifting_forms') }}'">Workout Input/Edit</button>
  <button class="tablinks tab-link" onclick="window.location.href='{{ url_for('workout_dashboard') }}'">Workout Dashboard</button>
</div>

<!-- ══ CALENDAR TAB ══════════════════════════ -->
<div id="calendar_tab" class="calendar-page tabcontent active">

    <!-- ── Left column: add workouts + today ──────────────── -->
    <aside class="calendar-side">

        <section class="section-card">
            <div class="section-card-header">
                <h3>Add Workouts</h3>
            </div>
            <div class="card-body">
                <div class="field-group">
                    <label for="eventDate">Date</label>
                    <input type="date" id="eventDate">
                </div>

                <!-- one .workout-row per workout being logged for that date; JS clones the
                     first row's markup, so keep the structure and names in step with it -->
                <div class="workout-rows" id="workoutRows">
                    <div class="workout-row">
                        <button type="button" class="btn-remove-row" aria-label="Remove this workout">&times;</button>
                        <select autocomplete="off" class="workout-type" aria-label="Workout type">
                            <option value="">Workout type</option>
                            {% for type in workout_types %}
                            <option value="{{ type }}">{{ type }}</option>
                            {% endfor %}
                        </select>
                        <select autocomplete="off" class="workout-name" aria-label="Workout name">
                            <option value="">Workout name</option>
                        </select>
                    </div>
                </div>

                <button type="button" class="btn-ghost" id="addWorkoutRow">+ Add another</button>
                <!-- TODO(backend): POST these rows to an insert route, then re-render the
                     month and today's list from the response instead of reloading -->
                <button type="button" class="btn-save" id="addWorkout">Save workouts</button>
            </div>
        </section>

        <section class="section-card">
            <div class="section-card-header">
                <!-- reads "Today" until a different day is clicked on the calendar -->
                <h3 id="reminderTitle">Today</h3>
                <span class="day-meta" id="todayDate"></span>
            </div>
            <div class="card-body">
                <ul class="reminder-list" id="reminderList"></ul>
                <!-- the list's checkboxes only stage intent; this is what writes them -->
                <button type="button" class="btn-save" id="saveReminders" hidden>Save changes</button>
            </div>
        </section>

        <section class="section-card">
            <div class="section-card-header">
                <h3>Journals</h3>
            </div>
            <div class="card-body journal-links">
                <a class="btn-ghost" id="throwingJournalLink" href="{{ url_for('inszn_throwing_form') }}">Throwing Journal</a>
                <a class="btn-ghost" id="workoutJournalLink" href="{{ url_for('workout_form') }}">Workout Journal</a>
            </div>
        </section>

    </aside>

    <!-- ── Calendar ───────────────────────────────────────── -->
    <section class="section-card calendar-card">

        <div class="calendar-head">
            <button type="button" class="nav-btn" id="previous" aria-label="Previous month">&lsaquo;</button>
            <h2 id="monthAndYear"></h2>
            <button type="button" class="nav-btn" id="next" aria-label="Next month">&rsaquo;</button>
        </div>

        <div class="calendar-scroll">
            <table class="table-calendar" id="calendar" data-lang="en">
                <thead id="thead-month"></thead>
                <tbody id="calendar-body"></tbody>
            </table>
        </div>

        <div class="calendar-foot">
            <label for="month">Jump to</label>
            <select autocomplete="off" id="month" aria-label="Month">
                <option value="0">Jan</option>
                <option value="1">Feb</option>
                <option value="2">Mar</option>
                <option value="3">Apr</option>
                <option value="4">May</option>
                <option value="5">Jun</option>
                <option value="6">Jul</option>
                <option value="7">Aug</option>
                <option value="8">Sep</option>
                <option value="9">Oct</option>
                <option value="10">Nov</option>
                <option value="11">Dec</option>
            </select>
            <select autocomplete="off" id="year" aria-label="Year"></select>
            <button type="button" class="btn-today" id="jumpToday">Today</button>

            <!-- colour key for the day chips; built from WORKOUT_TYPES so it cannot drift -->
            <span class="chip-legend" id="chipLegend"></span>
        </div>

    </section>

</div>

<!-- ── Log Weights Modal ────────────────────── -->
<!-- opened by clicking a workout in the Today card; the row clicked is the log's identity,
     so name and date are shown rather than entered -->
<div id="logWeights-modal" class="modal">
  <div class="modal-inner">
    <div class="modal-header">
      <h2>Log Weights</h2>
      <button class="modal-close" data-modal="logWeights-modal">&#x2715;</button>
    </div>
    <div class="modal-content">
      <div class="field-group">
        <label>Workout</label>
        <p id="weight-log-name" class="day-meta"></p>
        <!-- the workout's own notes, to read while logging; hidden when it has none -->
        <p id="weight-log-notes" class="weight-log-notes hidden"></p>
      </div>
      <!-- names where the placeholders came from, so an untouched row is never mistaken
           for a fresh entry -->
      <p id="weight-log-meta" class="day-meta"></p>
      <div class="field-group">
        <label>Exercises</label>
        <div id="weight-rows" class="modal-rows"></div>
      </div>
      <div class="modal-btn-group">
        <button type="button" id="addWeightRow">+ Add Exercise</button>
      </div>
      <button id="saveWeightLog" class="btn-save">Save Log</button>
    </div>
  </div>
</div>

<!-- ── View Session Modal ───────────────────── -->
<!-- read-only: throwing days and warmups have nothing to log, only to look at -->
<div id="viewSession-modal" class="modal">
  <div class="modal-inner">
    <div class="modal-header">
      <h2 id="view-session-title">Session</h2>
      <button class="modal-close" data-modal="viewSession-modal">&#x2715;</button>
    </div>
    <div class="modal-content" id="view-session-body"></div>
  </div>
</div>

<!-- one exercise row in the weight log; the name is a label, only the two inputs are typed into -->
<template id="weight-row-template">
  <div class="modal-row weight-row">
    <span class="row-ex-label">
      <span class="row-ex-block-tag"></span>
      <span class="row-ex-name-text"></span>
    </span>
    <input type="text" class="row-sets-reps-done" placeholder="Sets/Reps">
    <input type="number" step="any" class="row-weight-value" placeholder="Weight">
    <input type="text" class="row-weight-note row-notes" placeholder="Note">
  </div>
</template>



<script>
    // the workout_type CHECK constraint is the source of truth for these; passed through
    // from the route so the chip colours, legend and dropdown can never drift from the schema
    const WORKOUT_TYPES = {{ workout_types | tojson }};
    // every logged workout, so month navigation needs no round trip
    const INITIAL_WORKOUTS = {{ workouts | tojson }};
    // the dates already logged in each journal; the side panel's links strike out on those days
    const JOURNAL_DATES = {{ journal_dates | tojson }};
</script>
<script src="{{ url_for('static', filename='js/training_calendar.js') }}"></script>
{% endblock %}
