{% extends "inszn_base.html" %}
{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/game_form.css') }}">
{% endblock %}
{% block content %}
<form id="game-form" method="POST" action="/submit_game_journal">
  <h2>Game Journal</h2>

  <!-- Date + Opponent -->
  <div class="row-2col">
    <div class="field-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" required>
    </div>
    <div class="field-group">
      <label for="opponent">Opponent</label>
      <textarea id="opponent" name="opponent" rows="1"></textarea>
    </div>
  </div>

  <!-- Get Hot + Bullpen Throws -->
  <div class="warmup-row">
    <div class="checkbox-field">
      <input type="checkbox" id="get-hot" name="get_hot" value="yes">
      <label for="get-hot">Get Hot?</label>
    </div>
    <div class="field-group">
      <label for="bullpen-throws">Bullpen Throws</label>
      <input type="number" id="bullpen-throws" name="bullpen_throws" placeholder="# of throws in bullpen">
    </div>
  </div>

  <!-- Go In Game + Game Throws -->
  <div class="warmup-row">
    <div class="checkbox-field">
      <input type="checkbox" id="in-game" name="in_game" value="yes">
      <label for="in-game">Go In Game?</label>
    </div>
    <div class="field-group">
      <label for="game-throws">Game Throws</label>
      <input type="number" id="game-throws" name="game_throws" placeholder="# of pitches + game warmups">
    </div>
  </div>

  <!-- Game Line -->
  <h3>Game Line</h3>
  <div id="game-line-grid">
    <div class="stat-cell">
      <label for="ip">IP</label>
      <input type="number" step="0.1" id="ip" name="ip" min="0" max="9" placeholder="0">
    </div>
    <div class="stat-cell">
      <label for="hits">H</label>
      <input type="number" step="1" id="hits" name="hits" min="0" max="20" placeholder="0">
    </div>
    <div class="stat-cell">
      <label for="er">ER</label>
      <input type="number" step="1" id="er" name="er" min="0" max="20" placeholder="0">
    </div>
    <div class="stat-cell">
      <label for="bb">BB</label>
      <input type="number" step="1" id="bb" name="bb" min="0" max="10" placeholder="0">
    </div>
    <div class="stat-cell">
      <label for="so">SO</label>
      <input type="number" step="1" id="so" name="so" min="0" max="20" placeholder="0">
    </div>
    <div class="stat-cell">
      <label for="hr">HR</label>
      <input type="number" step="1" id="hr" name="hr" min="0" max="10" placeholder="0">
    </div>
  </div>

  <!-- Notes -->
  <h3>Notes</h3>
  <div class="notes-stack">
    <div class="field-group">
      <label for="subjective-notes">Subjective</label>
      <textarea id="subjective-notes" name="subjective_notes" placeholder="How did you think it went / feel?"></textarea>
    </div>
    <div class="field-group">
      <label for="objective-notes">Objective</label>
      <textarea id="objective-notes" name="objective_notes" placeholder="What actually happened / data?"></textarea>
    </div>
    <div class="field-group">
      <label for="feel-notes">Feel</label>
      <textarea id="feel-notes" name="feel_notes" placeholder="Mech / Feel / Cmd / Pitches notes"></textarea>
    </div>
    <div class="field-group">
      <label for="post-outing-notes">Post Outing</label>
      <textarea id="post-outing-notes" name="post_outing_notes" placeholder="What was working? What needs to be better? Adjustments / things to maximize?"></textarea>
    </div>
  </div>

  <button type="submit">Save Game Journal</button>
</form>
    <script src="{{ url_for('static', filename='game_form.js') }}"></script>
{% endblock %}
