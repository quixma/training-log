<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baseball Web App</title>

    <!-- Home-screen install. Without a manifest, "Add to Home Screen" saves whatever
         page happened to be open as the launch URL; start_url pins it to "/" so the
         shortcut always lands on inszn_home. -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#1f5fa8">
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}" sizes="192x192">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Training Log">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/inszn_base.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>
    <div class="sidebar" id="sidebar">
        <button id="sb-btn" title="Toggle Sidebar">&#9776;</button>
        <a href="{{ url_for('inszn_home') }}">
            <span class="icon">🏠</span>
            <span class="link-text">Home</span>
        </a>
        <a href="{{ url_for('training_calendar') }}">
            <span class="icon">🗓️</span>
            <span class="link-text">Training Calendar</span>
        </a>
        <a href="{{ url_for('workout_dashboard') }}">
            <span class="icon">📊</span>
            <span class="link-text">Workout Dashboard</span>
        </a>

        <div class="sidebar-section-title"><span class="link-text">Throwing</span></div>
        <a href="{{ url_for('inszn_throwing_form') }}">
            <span class="icon">&#128211;</span>
            <span class="link-text">Throwing Journal</span>
        </a>
        <a href="{{ url_for('game_form') }}">
            <span class="icon">&#128210;</span>
            <span class="link-text">Game Journal</span>
        </a>
        <a href="{{ url_for('inszn_throwing_plan') }}">
            <span class="icon">📅</span>
            <span class="link-text">Throwing Plan</span>
        </a>
        <div class="sidebar-section-title"><span class="link-text">Training</span></div>
        <a href="{{ url_for('workout_form') }}">
            <span class="icon">&#127947;</span>
            <span class="link-text">Workout Log</span>
        </a>
        <a href="{{ url_for('workout_data') }}">
            <span class="icon">&#128200;</span>
            <span class="link-text">Workout Data</span>
        </a>
        <a href="{{ url_for('lifting_forms') }}">
            <span class="icon">&#9917;</span>
            <span class="link-text">Workout Input/Edit</span>
        </a>

        <div class="sidebar-section-title"><span class="link-text">Data</span></div>
        <a href="{{ url_for('outing_report') }}">
            <span class="icon">&#128202;</span>
            <span class="link-text">Outing Report</span>
        </a>
        <a href="{{ url_for('bullpen_report') }}">
            <span class="icon">📈</span>
            <span class="link-text">Bullpen Report</span>
        </a>
        <a href="{{ url_for('game_data_dashboard') }}">
            <span class="icon">&#128225;</span>
            <span class="link-text">Game Data Dashboard</span>
        </a>    

    </div>
    <div class="content" id="content">
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/inszn_base.js') }}"></script>
</body>
</html>
