{% extends "inszn_base.html" %}
{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inszn_throwing_form.css') }}">
{% endblock %}
{% block content %}
<form id="inszn-throwing-form" method="POST" action="/submit_insznthrow">
  <h2>Throwing Journal</h2>

  <div class="row-3col">
    <div class="field-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" required>
    </div>
    <div class="field-group">
      <label for="throwing-block">Throwing Block</label>
      <select id="throwing-block" name="throwing_block" required>
        <option value="">Select Block</option>
        <option value="deload">Deload</option>
        <option value="on_ramp">On Ramp</option>
        <option value="velo_phase">Velo Phase</option>
        <option value="pre_season">Pre-season</option>
        <option value="return_to_throw">Return to Throw</option>
        <option value = "in_season">In Season</option>
      </select>
    </div>
    <div class="field-group">
      <label for="session-type">Session Type</label>
      <select id="session-type" name="session_type" required>
        <option value="">Select Type</option>
        <option value="recovery">Recovery</option>
        <option value="recovery+">Recovery+</option>
        <option value="game_prep">Game Prep</option>
        <option value="hybrid_a">Hybrid A</option>
        <option value="hybrid_b_pitching">Hybrid B Pitching</option>
		  <option value="hybrid_b_delivery">Hybrid B Delivery</option>
        <option value="extension_day">Extension LT</option>
        <option value="mound_blend">Mound Blend</option>
        <option value="plyo_velo">Plyo Velo</option>
        <option value="pitch_design">Pitch Design</option>
        <option value="command_training">Command Training</option>
        <option value="bullpen">Bullpen</option>
        <option value="live_abs">Live ABs</option>
      </select>
    </div>
  </div>

  <div class="row-3col">
    <div class="field-group">
      <label for="body-weight">Bodyweight</label>
      <input type="number" step="0.01" id="body-weight" name="body_weight" placeholder="lbs">
    </div>
    <div class="field-group">
      <label for="non-baseball-throws">Non Baseball Throws</label>
      <input type="number" id="non-baseball-throws" name="non-baseball-throws" placeholder="0">
    </div>
    <div class="field-group">
      <label for="total-throws">Total Baseball Throws</label>
      <input type="number" id="total-throws" name="total_throws" placeholder="0">
    </div>

    <div class="field-group">
      <label for="working-set-throws">Working Set Throws</label>
      <input type="number" id="working-set-throws" name="working_set_throws" placeholder="0">
    </div>
    
    <div class="field-group">
      <label for="max-velocity">Max Velocity</label>
      <input type="number" step="0.01" id="max-velocity" name="max_velocity" placeholder="mph">
    </div>
    <div class="field-group">
      <label for="rpe">RPE (1–10)</label>
      <input type="number" step="0.1" id="rpe" name="rpe" min="1" max="10" placeholder="—">
    </div>
    <div class="field-group">
      <label for="arm-readiness">Arm Readiness (1-5)</label>
      <input type="number" step="0.01" id="arm-readiness" name="arm_readiness" min="1" max="5" placeholder="—">
    </div>
  </div>

  <h3>Session Breakdown</h3>
  <div id="drills-container">
    <div class="drill-row">
      <input type="text" name="drill_name[]" placeholder="Drill Name">
      <select name="drill_ball_weight[]">
        <option value="">Ball Weight</option>
        <option>3</option>
        <option>3.5</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>9</option>
        <option>11</option>
        <option>16</option>
        <option>21</option>
        <option>32</option>
        <option>48</option>
        <option>64</option>
        <option>jav</option>
        <option>football</option>
        <option>club</option>
        <option>volleyball</option>
        <option>tennis</option>
      </select>
      <input type="number" step="0.01" name="drill_velocity[]" placeholder="Max Velo">
      <input type="number" name="throw_count[]" placeholder="Throw Count">
    </div>
  </div>
  <div class="btn-group">
    <button type="button" onclick="addDrillRow()">+ Add Drill</button>
    <button type="button" class="btn-delete" onclick="deleteDrillRow()">Remove Drill Row</button>
  </div>

  <div class="field-group">
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="5"></textarea>
  </div>

  <button type="submit">Save Throwing Session</button>
</form>
    <script src="{{ url_for('static', filename='js/inszn_throwing_form.js') }}"></script>
{% endblock %}
